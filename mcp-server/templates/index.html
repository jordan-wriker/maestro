<!DOCTYPE html>
<html>

<head>
    <title>Agent Flight Recorder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: #252526;
            border-bottom: 1px solid #333;
            padding: 0 20px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 12px 32px;
            background: transparent;
            border: none;
            color: #808080;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #d4d4d4;
        }

        .nav-tab.active {
            color: #569cd6;
            border-bottom-color: #569cd6;
        }

        .nav-tab.active[data-agent="claude"] {
            color: #ce9178;
            border-bottom-color: #ce9178;
        }

        .nav-tab.active[data-agent="codex"] {
            color: #4ec9b0;
            border-bottom-color: #4ec9b0;
        }

        .connection-status {
            position: absolute;
            right: 20px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
        }

        .connected {
            background: #6a9955;
            color: #1e1e1e;
        }

        .disconnected {
            background: #f44747;
            color: #1e1e1e;
        }

        /* Main content area */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: width 0.2s, min-width 0.2s;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 40px;
            min-width: 40px;
        }

        .sidebar-header {
            padding: 12px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 12px;
            color: #808080;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            padding: 4px;
            font-size: 16px;
        }

        .toggle-btn:hover {
            color: #d4d4d4;
        }

        .sessions-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .sidebar.collapsed .sessions-list {
            display: none;
        }

        .session-card {
            background: #2d2d2d;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .session-card:hover {
            border-color: #569cd6;
        }

        .session-card.active {
            border-color: #569cd6;
            background: #37373d;
        }

        .session-card.active[data-agent="claude"] {
            border-color: #ce9178;
        }

        .session-card.active[data-agent="codex"] {
            border-color: #4ec9b0;
        }

        .session-id {
            font-size: 11px;
            color: #569cd6;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-card[data-agent="claude"] .session-id {
            color: #ce9178;
        }

        .session-card[data-agent="codex"] .session-id {
            color: #4ec9b0;
        }

        .session-meta {
            font-size: 10px;
            color: #808080;
        }

        /* Chat panel */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            font-size: 12px;
            color: #808080;
            flex-shrink: 0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* Event Cards */
        .event-card {
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
        }

        .event-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .event-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .event-content {
            padding: 12px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .event-content pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
            margin-top: 8px;
        }

        /* Event type colors */
        .event-prompt {
            background: #2d4a3e;
            border-left: 3px solid #4ec9b0;
        }
        .event-prompt .event-header { background: #1e3a2f; }
        .event-prompt .event-tag { background: #4ec9b0; color: #1e1e1e; }

        .event-system {
            background: #2d2d3a;
            border-left: 3px solid #808080;
        }
        .event-system .event-header { background: #252530; }
        .event-system .event-tag { background: #808080; color: #1e1e1e; }

        .event-reasoning {
            background: #3d3a2d;
            border-left: 3px solid #dcdcaa;
        }
        .event-reasoning .event-header { background: #332f25; }
        .event-reasoning .event-tag { background: #dcdcaa; color: #1e1e1e; }

        .event-tool_call {
            background: #2d3a4a;
            border-left: 3px solid #569cd6;
        }
        .event-tool_call .event-header { background: #253040; }
        .event-tool_call .event-tag { background: #569cd6; color: #1e1e1e; }

        .event-tool_result {
            background: #2d3540;
            border-left: 3px solid #6796c0;
        }
        .event-tool_result .event-header { background: #252d35; }
        .event-tool_result .event-tag { background: #6796c0; color: #1e1e1e; }

        .event-response {
            background: #3a2d4a;
            border-left: 3px solid #c586c0;
        }
        .event-response .event-header { background: #302540; }
        .event-response .event-tag { background: #c586c0; color: #1e1e1e; }

        .event-result {
            background: #2d4a2d;
            border-left: 3px solid #6a9955;
        }
        .event-result .event-header { background: #253a25; }
        .event-result .event-tag { background: #6a9955; color: #1e1e1e; }

        .event-error {
            background: #4a2d2d;
            border-left: 3px solid #f44747;
        }
        .event-error .event-header { background: #3a2525; }
        .event-error .event-tag { background: #f44747; color: #1e1e1e; }

        /* Tool output */
        .tool-output {
            margin-top: 8px;
            padding: 8px;
            background: #1e1e1e;
            border-radius: 4px;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
        }

        .tool-output-label {
            font-size: 10px;
            color: #808080;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .exit-code {
            margin-left: auto;
            font-size: 10px;
            color: #808080;
        }

        .exit-code.success {
            color: #6a9955;
        }

        .exit-code.error {
            color: #f44747;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #808080;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Turn separator */
        .turn-separator {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #555;
            font-size: 11px;
        }

        .turn-separator::before,
        .turn-separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .turn-separator span {
            padding: 0 12px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-tabs">
            <button class="nav-tab active" data-agent="claude">Claude</button>
            <button class="nav-tab" data-agent="codex">Codex</button>
        </div>
        <span id="connection-status" class="connection-status disconnected">Disconnected</span>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Sessions</span>
                <button class="toggle-btn" id="toggle-sidebar">&lt;</button>
            </div>
            <div class="sessions-list" id="sessions-list">
            </div>
        </aside>

        <!-- Chat Panel -->
        <main class="chat-panel">
            <div class="chat-header" id="chat-header">
                Select a session to view conversation
            </div>
            <div class="chat-container" id="chat-container">
                <div class="empty-state">
                    <div class="empty-state-icon">&#128172;</div>
                    <div>No session selected</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // State
        let currentAgent = 'claude';
        let currentSessionId = null;
        let ws = null;

        // DOM elements
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');
        const sessionsList = document.getElementById('sessions-list');
        const chatHeader = document.getElementById('chat-header');
        const chatContainer = document.getElementById('chat-container');
        const statusEl = document.getElementById('connection-status');
        const navTabs = document.querySelectorAll('.nav-tab');

        // Toggle sidebar
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '>' : '<';
        });

        // Nav tab switching
        navTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                navTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentAgent = tab.dataset.agent;
                currentSessionId = null;
                loadSessions();
            });
        });

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Get event type label
        function getEventLabel(type) {
            const labels = {
                'prompt': 'Prompt',
                'system': 'System',
                'reasoning': 'Thinking',
                'tool_call': 'Tool',
                'tool_result': 'Result',
                'response': 'Response',
                'result': 'Complete',
                'error': 'Error'
            };
            return labels[type] || type;
        }

        // Load sessions for current agent
        async function loadSessions() {
            try {
                const res = await fetch(`/api/sessions/${currentAgent}`);
                const data = await res.json();

                if (data.sessions && data.sessions.length > 0) {
                    renderSessions(data.sessions);
                    if (!currentSessionId) {
                        selectSession(data.sessions[0].session_id);
                    }
                } else {
                    sessionsList.innerHTML = '<div class="empty-state"><div>No sessions yet</div></div>';
                    chatHeader.textContent = 'No sessions available';
                    chatContainer.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#128172;</div><div>No sessions found for this agent</div></div>';
                }
            } catch (err) {
                console.error('Failed to load sessions:', err);
            }
        }

        // Render session cards
        function renderSessions(sessions) {
            sessionsList.innerHTML = sessions.map(s => `
                <div class="session-card ${s.session_id === currentSessionId ? 'active' : ''}"
                     data-session-id="${s.session_id}"
                     data-agent="${currentAgent}"
                     onclick="selectSession('${s.session_id}')">
                    <div class="session-id">${s.session_id.slice(0, 8)}...</div>
                    <div class="session-meta">${s.log_count} turn(s) &middot; ${s.last_activity}</div>
                </div>
            `).join('');
        }

        // Select a session
        async function selectSession(sessionId) {
            currentSessionId = sessionId;

            document.querySelectorAll('.session-card').forEach(card => {
                card.classList.toggle('active', card.dataset.sessionId === sessionId);
            });

            try {
                const res = await fetch(`/api/sessions/${currentAgent}/${sessionId}`);
                const data = await res.json();

                if (data.error) {
                    chatContainer.innerHTML = `<div class="empty-state"><div>${data.error}</div></div>`;
                    return;
                }

                chatHeader.textContent = `Session: ${sessionId.slice(0, 16)}...`;
                renderChat(data.logs || []);
            } catch (err) {
                console.error('Failed to load session logs:', err);
            }
        }

        // Render chat events
        function renderChat(logs) {
            if (logs.length === 0) {
                chatContainer.innerHTML = '<div class="empty-state"><div>No events in this session</div></div>';
                return;
            }

            let html = '';
            logs.forEach((log, logIndex) => {
                if (logIndex > 0) {
                    html += `<div class="turn-separator"><span>Turn ${logIndex + 1} &middot; ${escapeHtml(log.timestamp)}</span></div>`;
                }

                const events = log.events || [];
                events.forEach(event => {
                    html += renderEvent(event);
                });
            });

            chatContainer.innerHTML = html;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Render single event
        function renderEvent(event) {
            const type = event.type || 'unknown';
            const label = getEventLabel(type);

            let content = '';

            if (type === 'tool_call') {
                const toolName = event.tool || 'unknown';
                content = `<strong>${escapeHtml(toolName)}</strong><pre>${escapeHtml(event.content)}</pre>`;

                if (event.output) {
                    const exitClass = event.exit_code === 0 ? 'success' : (event.exit_code !== null ? 'error' : '');
                    content += `
                        <div class="tool-output">
                            <div class="tool-output-label">Output${event.exit_code !== null ? ` (exit: ${event.exit_code})` : ''}</div>
                            <pre style="margin:0">${escapeHtml(event.output)}</pre>
                        </div>
                    `;
                }
            } else if (type === 'result') {
                content = `<div style="color: #6a9955; margin-bottom: 8px;">&#10003; ${event.subtype || 'completed'}</div>${escapeHtml(event.content)}`;
            } else {
                content = escapeHtml(event.content);
            }

            return `
                <div class="event-card event-${type}">
                    <div class="event-header">
                        <span class="event-tag">${label}</span>
                        ${type === 'tool_call' && event.tool ? `<span style="color: #808080">${escapeHtml(event.tool)}</span>` : ''}
                    </div>
                    <div class="event-content">${content}</div>
                </div>
            `;
        }

        // WebSocket connection
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                statusEl.textContent = 'Connected';
                statusEl.className = 'connection-status connected';
            };

            ws.onclose = () => {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'connection-status disconnected';
                setTimeout(connectWebSocket, 2000);
            };

            ws.onerror = () => ws.close();

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'log_update') {
                    handleLogUpdate(data.log);
                }
            };
        }

        // Handle real-time log updates
        function handleLogUpdate(log) {
            if (log.agent !== currentAgent) return;
            loadSessions();
            if (currentSessionId) {
                selectSession(currentSessionId);
            }
        }

        // Initialize
        loadSessions();
        connectWebSocket();
    </script>
</body>

</html>
